<!DOCTYPE html>
<html lang="km" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Enforce browser rendering in light mode ONLY -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#1E3A8A" />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Google Fonts: Kantumruy Pro (Khmer) + Inter / Google Sans (Latin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <title>District Administration OCR & Verification Portal</title>
  </head>
  <body class="bg-gov-surface text-gov-text-primary antialiased font-sans min-h-screen selection:bg-blue-100 selection:text-blue-900">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
